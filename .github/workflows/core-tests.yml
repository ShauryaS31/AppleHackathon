name: core-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Test RecalledCore
        run: swift test --package-path RecalledCore
